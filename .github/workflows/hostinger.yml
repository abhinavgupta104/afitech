# Builds the site and commits the static output to the `hostinger` branch.
#
# Hostinger's Git deployment copies a branch into public_html as-is; it does
# not run a build. So the built files need a branch of their own. The branch
# history is kept linear (never force-pushed) because Hostinger updates its
# copy with `git pull`.

name: Build for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit dist/ to the hostinger branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads "$REMOTE" hostinger >/dev/null; then
            git clone --quiet --branch hostinger --single-branch "$REMOTE" out
          else
            git init --quiet -b hostinger out
            git -C out remote add origin "$REMOTE"
          fi

          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. out/

          # Vercel deploys every branch it sees; this one is not a project.
          echo '{"git":{"deploymentEnabled":false}}' > out/vercel.json

          cd out
          git add -A
          if git diff --cached --quiet; then
            echo "Build output unchanged."
            exit 0
          fi
          git commit --quiet -m "Build ${GITHUB_SHA::7}"
          git push --quiet origin hostinger
